server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. Resolving at request time means a recreated API container (new address) is
    # picked up without restarting nginx.
    resolver 127.0.0.11 valid=5s;

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-sent events (change-request progress) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
