# Scrapes production over the factory's control network. Development and preview stacks are
# not scraped: they come and go, and they hold no real traffic.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: crm-api
    metrics_path: /metrics
    static_configs:
      - targets: ["crm-api:8000"]
        labels:
          environment: production

  - job_name: crm-database
    static_configs:
      - targets: ["crm-db-exporter:9187"]
        labels:
          environment: production
