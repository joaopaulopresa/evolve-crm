# The CRM application: database, API and web. One copy of this stack runs per environment
# (development, each preview, production); deploy/compose.<environment>.yml adds what differs.
name: evolve-crm

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: crm
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: evolve-crm-api:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/crm
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RELEASE: ${IMAGE_TAG:-dev}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-to-a-long-random-value}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@evolve.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: evolve-crm-web:${IMAGE_TAG:-dev}
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
