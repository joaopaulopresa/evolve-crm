# The CRM application: database, API and web. One copy of this stack runs per environment
# (development, each preview, production); deploy/compose.<environment>.yml adds what differs.
name: evolve-crm

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: crm
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: evolve-crm-api:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://crm:${POSTGRES_PASSWORD:-crm}@db:5432/crm
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RELEASE: ${IMAGE_TAG:-dev}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-to-a-long-random-value}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@evolve.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-evolve-backups}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-evolve}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-evolve-backups}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: evolve-crm-web:${IMAGE_TAG:-dev}
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # Backups: MinIO stores them, the backup service takes them (database dump and git bundle)
  # on a schedule and before every production deploy. See backup/backup.sh.
  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-evolve}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-evolve-backups}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  backup:
    image: evolve-crm-backup:${IMAGE_TAG:-dev}
    build: ./backup
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PGURL: postgresql://crm:${POSTGRES_PASSWORD:-crm}@db:5432/crm
      ENVIRONMENT: ${ENVIRONMENT:-development}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-evolve-backups}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-evolve}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-evolve-backups}
      BACKUP_CRON: ${BACKUP_CRON:-0 */6 * * *}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # /srv/git/repo.git in local mode (the factory's bare repository), the GitHub URL in
      # github mode. In development there is no repository to back up and the step is skipped.
      GIT_SOURCE: ${GIT_SOURCE:-/srv/git/repo.git}
    volumes:
      - repo-git:/srv/git:ro

volumes:
  db-data:
  minio-data:
  repo-git:
